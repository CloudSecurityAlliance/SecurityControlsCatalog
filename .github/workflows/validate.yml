name: Validate

on:
  pull_request:
    paths:
      - "schemas/**"
      - "tools/**"
      - "objects/**"
      - "**.json"
      - "**.md"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schemas:
    name: Schemas and catalog objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema and PyYAML
        run: pip install --quiet jsonschema pyyaml

      - name: Schema self-test
        run: python3 tools/validate.py --self-test

      - name: Generators carry a publisher's text untouched
        # Tidying text in transit changes what the catalog asserts a publisher
        # requires. Published control data is not clean, and the fix for that
        # belongs upstream with the publisher, not in a generator.
        run: |
          python3 tools/generate_aicm_controls.py --self-test
          python3 tools/generate_aicm_caiq.py --self-test
          python3 tools/generate_aicm_eu_mappings.py --self-test
          python3 tools/generate_aicm_standard_mappings.py --self-test

      - name: The YAML view is lossless
        # The view exists so a person can review a control without reading UUIDs,
        # and it is only worth having if writing an edited view back reproduces the
        # committed JSON exactly. Published text carries carriage returns, tabs and
        # trailing spaces that a YAML block scalar cannot hold, so the round trip is
        # checked against every committed object rather than argued for.
        run: |
          python3 tools/yaml_view.py --self-test
          python3 tools/yaml_view.py --check

      - name: Every committed object names the generator that produces it
        # Nothing under objects/ is hand-authored, so a tool that writes to a
        # committed object has to be able to say which generator will overwrite it.
        # catalog.GENERATED_BY holds that mapping; this fails if an object cannot be
        # resolved through it, so adding a generator without adding its entry is
        # caught rather than silently reporting no provenance to a contributor.
        run: |
          python3 - <<'PY'
          import glob, json, sys, collections
          sys.path.insert(0, "tools")
          from catalog import generated_by, provenance_key
          missing, counts = {}, collections.Counter()
          for path in sorted(glob.glob("objects/**/*.json", recursive=True)):
              obj = json.load(open(path))
              if obj["type"] not in ("x-control", "x-regulation", "x-gap-mapping"):
                  continue
              generator = generated_by(obj, path)
              if generator is None:
                  missing.setdefault(provenance_key(obj, path), path)
              else:
                  counts[generator] += 1
          for generator, n in sorted(counts.items()):
              print(f"{n:5}  {generator}")
          if missing:
              for key, path in sorted(missing.items(), key=lambda kv: str(kv[0])):
                  print(f"no generator known for {key}: {path} — add it to "
                        f"catalog.GENERATED_BY")
          sys.exit(1 if missing else 0)
          PY

      - name: Validate the schema document's own examples
        # Keeps SCHEMA-STIX-OBJECT-EXTENSIONS.md and schemas/ from drifting apart:
        # the documented examples must satisfy the schemas that describe them.
        run: |
          python3 - <<'PY'
          import json, re, uuid, subprocess, sys, tempfile
          src = open("SCHEMA-STIX-OBJECT-EXTENSIONS.md").read()
          seen = {}
          def rep(m):
              seen.setdefault(m.group(0), str(uuid.uuid4()))
              return seen[m.group(0)]
          objs = [json.loads(re.sub(r"<UUID[^>]*>|<CSA_ID>", rep, b))
                  for b in re.findall(r"```json\n(.*?)```", src, re.S)
                  if b.lstrip().startswith("{")]
          if not objs:
              sys.exit("no JSON examples found in the schema document")
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as fh:
              json.dump({"type": "bundle", "id": f"bundle--{uuid.uuid4()}",
                         "objects": objs}, fh)
              path = fh.name
          print(f"extracted {len(objs)} example objects")
          sys.exit(subprocess.call([sys.executable, "tools/validate.py", path]))
          PY

      - name: Extension-definition ids match the schema document
        # The minted identifiers are permanent. If the committed objects and the
        # documented examples ever disagree, instance data would reference an id no
        # consumer has a definition for.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          doc = open("SCHEMA-STIX-OBJECT-EXTENSIONS.md").read()
          bad = []
          for path in sorted(glob.glob("objects/extension-definition/*.json")):
              obj = json.load(open(path))
              if obj.get("revoked"):
                  # A retired definition is deliberately absent from the schema
                  # document; it is kept only as a record of what was withdrawn.
                  print(f"{path}: retired, not required in the schema document")
                  continue
              if obj["id"] not in doc:
                  bad.append(f"{path}: {obj['id']} not referenced in the schema document")
          ident = json.load(open("objects/identity/cloud-security-alliance.json"))
          if ident["id"] not in doc:
              bad.append(f"identity {ident['id']} not referenced in the schema document")
          print("\n".join(bad) if bad else "all minted ids appear in the schema document")
          sys.exit(1 if bad else 0)
          PY

      - name: Docs name every custom type
        # Adding a type is not done until the docs that enumerate the model say so.
        # CONVENTIONS-STIX-MODELING.md is excluded on purpose: it states rules that
        # bind all objects and names a type only when one illustrates a rule, so
        # requiring the full set there would force filler.
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          docs = ["README.md", "AGENTS.md", "CLAUDE.md", "schemas/README.md",
                  "objects/README.md", "SCHEMA-STIX-OBJECT-EXTENSIONS.md",
                  "DESIGN-RATIONALE-STIX-EXTENSIONS.md"]
          types = []
          for path in sorted(glob.glob("objects/extension-definition/*.json")):
              obj = json.load(open(path))
              # A retired definition is a record of what was withdrawn, not part of
              # the model any document is obliged to describe.
              if not obj.get("revoked"):
                  types.append(os.path.basename(path)[:-len(".json")])
          if not types:
              sys.exit("no live extension definitions found — check the glob")
          bad = [f"{d}: never mentions {t}" for d in docs
                 for t in types if t not in open(d).read()]
          print("\n".join(bad) if bad
                else f"all {len(docs)} docs name every live type: {', '.join(types)}")
          sys.exit(1 if bad else 0)
          PY

      - name: Docs do not count the custom types
        # "the five types" was written into ~20 sentences and every one of them went
        # wrong the day a sixth was added. A count in prose is a copy of something
        # objects/extension-definition/ already states, so prefer "the custom types".
        # A genuine local count can opt out with a trailing <!-- count-ok --> marker.
        run: |
          python3 - <<'PY'
          import glob, re, sys
          COUNT = re.compile(
              r"(?<![\w.])(one|two|three|four|five|six|seven|eight|nine|ten|\d+)(?![\w.])\s+"
              r"((?:custom|other|STIX|object|SDO|extension|definition|specific)\s+){0,3}"
              r"(types|SDOs|definitions|identifiers)\b", re.I)
          bad = []
          for path in sorted(set(glob.glob("*.md")) | set(glob.glob("*/*.md"))):
              for n, line in enumerate(open(path), 1):
                  if "<!-- count-ok -->" in line:
                      continue
                  for m in COUNT.finditer(line):
                      bad.append(f"{path}:{n}: counts the types: {m.group(0)!r}")
          print("\n".join(bad) if bad else "no prose counts the custom types")
          sys.exit(1 if bad else 0)
          PY

      - name: Documented counts match the committed objects
        # A stale count in a document that exists to be trusted is worse than no
        # count at all, so the tables are generated from the objects rather than
        # typed. If this fails, run: python3 tools/coverage.py --write
        run: python3 tools/coverage.py --check

      - name: Objects agree with their path, identifier, and SecID
        # The schemas check one object at a time and cannot see that a file sits
        # in the wrong directory, that its SecID contradicts its own provenance
        # properties, or that a regenerated object reused another's identifier.
        # Those are exactly the ways a generator goes wrong at scale.
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys
          bad, ids = [], {}
          for path in sorted(glob.glob("objects/**/*.json", recursive=True)):
              obj = json.load(open(path))
              p = pathlib.Path(path)
              if obj["id"] in ids:
                  bad.append(f"{path}: id already used by {ids[obj['id']]}")
              ids[obj["id"]] = path
              if not obj["id"].startswith(obj["type"] + "--"):
                  bad.append(f"{path}: id does not start with its own type")
              if p.parts[1] != obj["type"]:
                  bad.append(f"{path}: sits under {p.parts[1]}, but is a {obj['type']}")
              if obj["type"] == "x-control":
                  # framework_version is optional: some publishers do not version
                  # their catalogues, and those objects carry no version segment in
                  # the path and no @version in the SecID either.
                  version = obj.get("framework_version")
                  want = tuple(x for x in (obj["framework_namespace"], obj["framework"],
                                           version, obj["control_identifier"])
                               if x is not None)
                  got = (*p.parts[2:-1], p.stem)
                  expected = "secid:control/{}/{}{}#{}".format(
                      obj["framework_namespace"], obj["framework"],
                      f"@{version}" if version else "", obj["control_identifier"])
              elif obj["type"] == "x-regulation":
                  want = (obj["regulation_namespace"], obj["regulation"],
                          obj["clause_identifier"])
                  got = (*p.parts[2:4], p.stem)
                  expected = "secid:regulation/{}/{}#{}".format(*want)
              else:
                  continue
              if got != want:
                  bad.append(f"{path}: path says {got}, properties say {want}")
              secids = [r["external_id"] for r in obj.get("external_references", [])
                        if r.get("source_name") == "secid"]
              if secids != [expected]:
                  bad.append(f"{path}: SecID is {secids}, expected [{expected!r}]")
          print("\n".join(bad) if bad
                else f"{len(ids)} objects agree with their path, identifier, and SecID")
          sys.exit(1 if bad else 0)
          PY

      - name: References resolve to committed objects
        # The OASIS validator's --enforce-refs resolves references within a bundle.
        # Catalog objects are committed one per file and validated as a file list,
        # so it has nothing to resolve against: a dangling target_ref passes it
        # silently. Verified by planting one, which --enforce-refs did not catch.
        #
        # This also covers the rule that an extension-definition must travel with
        # the instances referencing it, by treating the extensions keys as
        # references like any other.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          objs = {}
          for path in sorted(glob.glob("objects/**/*.json", recursive=True)):
              obj = json.load(open(path))
              objs[obj["id"]] = (path, obj)

          def refs(obj):
              for key, value in obj.items():
                  if key == "extensions":
                      yield from ((key, ref) for ref in value)
                  elif key.endswith("_ref") and isinstance(value, str):
                      yield key, value
                  elif key.endswith("_refs") and isinstance(value, list):
                      yield from ((key, ref) for ref in value)

          bad, checked = [], 0
          for path, obj in objs.values():
              for key, ref in refs(obj):
                  checked += 1
                  if ref not in objs:
                      bad.append(f"{path}: {key} -> {ref} is not a committed object")
              # derived-from reads left to right: a questionnaire item is derived
              # from the control it assesses. A reversed pair satisfies the schema,
              # since both ends are an x-control, but inverts the meaning.
              if obj.get("relationship_type") == "derived-from":
                  src = objs.get(obj["source_ref"], (None, {}))[1]
                  tgt = objs.get(obj["target_ref"], (None, {}))[1]
                  if not src.get("framework", "").endswith("-caiq"):
                      bad.append(f"{path}: derived-from source {src.get('framework')!r} "
                                 f"is not a questionnaire framework — is it reversed?")
                  if tgt.get("framework", "").endswith("-caiq"):
                      bad.append(f"{path}: derived-from target {tgt.get('framework')!r} "
                                 f"is a questionnaire framework — is it reversed?")
          print("\n".join(bad) if bad
                else f"{checked} references across {len(objs)} objects all resolve")
          sys.exit(1 if bad else 0)
          PY

      - name: Quarantined claims are not also published
        # A held-back claim that also has a published object is the failure this
        # whole mechanism exists to prevent: it would mean a verdict was published
        # over the targets that happened to parse, which asserts something the
        # publisher never assessed. The generators cannot run here — the source
        # data lives outside this repository — so the invariant is checked against
        # what is committed.
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys
          bad, files = [], sorted(glob.glob("quarantine/*.json"))
          if not files:
              print("no quarantine files")
              sys.exit(0)
          controls = {json.load(open(p))["control_identifier"]
                      for p in glob.glob("objects/x-control/**/*.json", recursive=True)}
          for path in files:
              q = json.load(open(path))
              held = [e["control"] for e in q["entries"]]
              if len(held) != q["controls_held"]:
                  bad.append(f"{path}: says {q['controls_held']} held, lists {len(held)}")
              if sum(len(e["unparsed"]) for e in q["entries"]) != q["references_unparsed"]:
                  bad.append(f"{path}: references_unparsed does not match the entries")
              if len(set(held)) != len(held):
                  bad.append(f"{path}: a control is listed more than once")
              mappings = pathlib.Path(q["mappings"])
              published = {p.stem for p in mappings.glob("*.json")}
              for control in held:
                  if control in published:
                      bad.append(f"{path}: {control} is quarantined but {mappings}/"
                                 f"{control}.json was published anyway")
                  if control not in controls:
                      bad.append(f"{path}: {control} is not a committed control")
              if len(published) != q["controls_mapped"]:
                  bad.append(f"{path}: says {q['controls_mapped']} mapped, "
                             f"{mappings} holds {len(published)}")
              print(f"{path}: {q['controls_mapped']} published, {len(held)} held, "
                    f"{q['references_unparsed']} unparsed references")
          print("\n".join(bad) if bad else "quarantine and published claims are disjoint")
          sys.exit(1 if bad else 0)
          PY

      - name: Validate any committed catalog objects
        run: |
          files=$(find objects catalog bundles -type f -name '*.json' 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "no committed objects yet — skipping"
            exit 0
          fi
          echo "$files" | xargs python3 tools/validate.py

  stix-conformance:
    name: STIX 2.1 conformance (OASIS validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the OASIS validator from source
        # NOT from PyPI: the published wheel omits its bundled JSON schemas, and the
        # tool then fails on every object including standard ones. The schemas are a
        # git submodule, so a recursive clone is required.
        run: |
          git clone --quiet --recursive --depth 1 \
            https://github.com/oasis-open/cti-stix-validator.git /tmp/cti-stix-validator
          test -d /tmp/cti-stix-validator/stix2validator/schemas-2.1/schemas \
            || { echo "bundled schemas missing — the submodule did not check out"; exit 1; }
          pip install --quiet -e /tmp/cti-stix-validator

      - name: Confirm the validator works at all
        # Guards against a silent pass: a broken validator would otherwise report
        # nothing to check and look green.
        run: |
          cat > /tmp/plain.json <<'EOF'
          {"type":"bundle","id":"bundle--0e5b6f0e-6f0e-4e5b-8f0e-6f0e4e5b8f0e","objects":[
           {"type":"identity","spec_version":"2.1",
            "id":"identity--1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d",
            "created":"2026-01-15T00:00:00.000Z","modified":"2026-01-15T00:00:00.000Z",
            "name":"Cloud Security Alliance","identity_class":"organization"}]}
          EOF
          python3 -m stix2validator.scripts.stix2_validator /tmp/plain.json

      - name: Validate committed catalog objects for STIX conformance
        run: |
          files=$(find objects catalog bundles -type f -name '*.json' 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "no committed objects yet — skipping"
            exit 0
          fi
          # 302 warns that an external reference has a URL but no hash. Catalog
          # references are web pages and registry identifiers, not files, so a hash is
          # meaningless there and the check would fire on every object without ever
          # being actionable. No other check is disabled.
          echo "$files" | xargs python3 -m stix2validator.scripts.stix2_validator \
            --schemas ./schemas/ --enforce-refs --disable 302
